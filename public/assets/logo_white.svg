<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Philosopher:wght@700&amp;family=Inter:wght@600&amp;display=swap');
      .brand-title {
        font-family: 'Philosopher', 'Cinzel', 'Georgia', serif;
        font-size: 23px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: 1px;
      }
      .brand-sub {
        font-family: 'Inter', 'Segoe UI', sans-serif;
        font-size: 10.5px;
        font-weight: 600;
        fill: #e2e8f0;
        letter-spacing: 3.2px;
      }
    </style>
  </defs>

  <!-- Emblem Mark Group -->
  <g transform="translate(12, 10) scale(0.390625)">
    <!-- Outer Shield Ring -->
    <path d="M 128 16 C 180 16 224 48 224 96 C 224 168 152 224 128 240 C 104 224 32 168 32 96 C 32 48 76 16 128 16 Z" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Open Book Base -->
    <path d="M 128 184 C 108 174 80 172 56 182 L 56 132 C 80 122 108 124 128 134 Z" fill="#ffffff" />
    <path d="M 128 184 C 148 174 176 172 200 182 L 200 132 C 176 122 148 124 128 134 Z" fill="#ffffff" />
    
    <!-- Central Spine Accent -->
    <rect x="124" y="132" width="8" height="54" rx="4" fill="#d4a337" />

    <!-- Rising Knowledge Torch / Flame -->
    <path d="M 128 48 C 138 72 146 88 140 106 C 136 118 128 124 128 124 C 128 124 120 118 116 106 C 110 88 118 72 128 48 Z" fill="#d4a337" />
    <path d="M 112 76 C 118 88 118 98 110 110 C 102 120 92 120 92 120 C 92 120 96 108 102 98 C 106 90 108 82 112 76 Z" fill="#ffffff" />
    <path d="M 144 76 C 138 88 138 98 146 110 C 154 120 164 120 164 120 C 164 120 160 108 154 98 C 150 90 148 82 144 76 Z" fill="#ffffff" />

    <!-- Star of Excellence at Top -->
    <polygon points="128,24 131,31 138,32 133,37 134,44 128,40 122,44 123,37 118,32 125,31" fill="#d4a337" />
  </g>

  <!-- Typography Lockup -->
  <text x="126" y="58" class="brand-title">SMA NUSANTARA CENDEKIA</text>
  <line x1="126" y1="69" x2="520" y2="69" stroke="#d4a337" stroke-width="1.5" stroke-linecap="round" />
  <text x="126" y="89" class="brand-sub">SEKOLAH BERASRAMA TERPADU</text>
</svg>