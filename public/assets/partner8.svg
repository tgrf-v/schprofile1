<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Modern Hexagonal Shield Outer -->
  <polygon points="100,14 176,56 176,144 100,186 24,144 24,56" fill="#f8fafc" stroke="#334155" stroke-width="6" stroke-linejoin="round" />
  <polygon points="100,26 164,62 164,138 100,174 36,138 36,62" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 3" />
  
  <!-- Tech Circuit Nodes & Triangle Matrix -->
  <!-- Top Node -->
  <circle cx="100" cy="54" r="8" fill="#0891b2" />
  <!-- Bottom Left Node -->
  <circle cx="64" cy="118" r="8" fill="#0891b2" />
  <!-- Bottom Right Node -->
  <circle cx="136" cy="118" r="8" fill="#0891b2" />
  
  <!-- Circuit Traces Connecting Nodes -->
  <line x1="100" y1="54" x2="64" y2="118" stroke="#334155" stroke-width="3" />
  <line x1="100" y1="54" x2="136" y2="118" stroke="#334155" stroke-width="3" />
  <line x1="64" y1="118" x2="136" y2="118" stroke="#334155" stroke-width="3" />
  
  <!-- Center Microchip / Prism Diamond -->
  <polygon points="100,76 116,94 100,112 84,94" fill="#0891b2" stroke="#334155" stroke-width="2" />
  <circle cx="100" cy="94" r="4" fill="#ffffff" />
  
  <!-- Base Acronym Ribbon -->
  <rect x="70" y="146" width="60" height="18" rx="3" fill="#334155" />
  <text x="100" y="159" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">CUT</text>
</svg>