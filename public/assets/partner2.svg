  <!-- Inner Shield -->
  <path d="M 100 24 C 140 24 168 46 168 84 C 168 136 116 166 100 176 C 84 166 32 136 32 84 C 32 46 60 24 100 24 Z" fill="#ffffff" stroke="#991b1b" stroke-width="3" />
  
  <!-- Atomic Orbital Rings -->
  <ellipse cx="100" cy="94" rx="48" ry="18" fill="none" stroke="#1e293b" stroke-width="2.5" transform="rotate(30 100 94)" />
  <ellipse cx="100" cy="94" rx="48" ry="18" fill="none" stroke="#1e293b" stroke-width="2.5" transform="rotate(-30 100 94)" />
  <ellipse cx="100" cy="94" rx="48" ry="18" fill="none" stroke="#991b1b" stroke-width="2.5" transform="rotate(90 100 94)" />
  
  <!-- Central Energy Core -->
