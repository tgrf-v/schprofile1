<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Sunburst Radiant Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="#fffbeb" stroke="#b45309" stroke-width="6" />
  
  <!-- Radiating Sun Rays Group -->
  <g stroke="#b45309" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="22" x2="100" y2="34" />
    <line x1="100" y1="166" x2="100" y2="178" />
    <line x1="22" y1="100" x2="34" y2="100" />
    <line x1="166" y1="100" x2="178" y2="100" />
    <line x1="45" y1="45" x2="54" y2="54" />
    <line x1="146" y1="146" x2="155" y2="155" />
    <line x1="45" y1="155" x2="54" y2="146" />
    <line x1="146" y1="54" x2="155" y2="45" />
  </g>
  
  <!-- Inner Sun Disc -->
  <circle cx="100" cy="94" r="48" fill="#fef3c7" stroke="#b45309" stroke-width="3" />
  
  <!-- Medical / Scientific Beacon Cross -->
  <rect x="94" y="64" width="12" height="60" fill="#15803d" rx="2" />
  <rect x="70" y="88" width="60" height="12" fill="#15803d" rx="2" />
  
  <!-- Center Golden Star -->
  <circle cx="100" cy="94" r="8" fill="#d4a337" />
  
  <!-- Base Acronym Ribbon -->
  <rect x="68" y="146" width="64" height="20" rx="4" fill="#b45309" />
  <text x="100" y="160" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">USM</text>
</svg>